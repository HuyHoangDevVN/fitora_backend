name: Deploy backend to Ubuntu

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a non-mutating connection preflight, or deploy this exact SHA"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy

permissions:
  contents: read

concurrency:
  group: fitora-backend-production
  cancel-in-progress: false

jobs:
  production-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Production deployment must be dispatched from main." >&2
            exit 1
          }

  verify:
    needs: production-branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.408
      - run: |
          jq empty ApiGateways/ApiGateway/ocelot.json
          jq empty ApiGateways/ApiGateway/appsettings.json
      - run: dotnet restore fitora_backend.sln
      - run: dotnet build fitora_backend.sln -c Release --no-restore
      - run: dotnet test fitora_backend.sln -c Release --no-build --no-restore

  preflight:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Connect ephemeral runner to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.FITORA_TAILSCALE_CLIENT_ID }}
          audience: ${{ secrets.FITORA_TAILSCALE_AUDIENCE }}
          tags: tag:fitora-ci
          hostname: fitora-ci-${{ github.run_id }}-${{ github.run_attempt }}
          version: 1.102.3
          timeout: 2m
          use-cache: false
          ping: ${{ vars.FITORA_DEPLOY_HOST }}
      - name: Verify Ubuntu deployment target without mutation
        env:
          FITORA_DEPLOY_HOST: ${{ vars.FITORA_DEPLOY_HOST }}
          FITORA_DEPLOY_PORT: ${{ vars.FITORA_DEPLOY_PORT }}
          FITORA_DEPLOY_USER: ${{ vars.FITORA_DEPLOY_USER }}
          FITORA_DEPLOY_SSH_KEY: ${{ secrets.FITORA_DEPLOY_SSH_KEY }}
          FITORA_DEPLOY_KNOWN_HOSTS: ${{ secrets.FITORA_DEPLOY_KNOWN_HOSTS }}
          FITORA_DEPLOY_ROOT: ${{ vars.FITORA_DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          [[ -n "$FITORA_DEPLOY_HOST" && -n "$FITORA_DEPLOY_USER" && -n "$FITORA_DEPLOY_SSH_KEY" && -n "$FITORA_DEPLOY_KNOWN_HOSTS" ]] || { echo "Missing Fitora deployment secrets." >&2; exit 1; }
          [[ "$FITORA_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "FITORA_DEPLOY_PORT must be numeric." >&2; exit 1; }
          [[ "$FITORA_DEPLOY_ROOT" == "/home/fitdnu/fitora" ]] || { echo "Unexpected FITORA_DEPLOY_ROOT." >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$FITORA_DEPLOY_SSH_KEY" > ~/.ssh/id_fitora
          printf '%s\n' "$FITORA_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_fitora ~/.ssh/known_hosts
          target="${FITORA_DEPLOY_USER}@${FITORA_DEPLOY_HOST}"
          ssh -i ~/.ssh/id_fitora -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$FITORA_DEPLOY_PORT" "$target" 'bash -s' <<'REMOTE'
          set -euo pipefail
          fail() { echo "PREFLIGHT FAILED: $1" >&2; exit 1; }
          root=/home/fitdnu/fitora
          [[ "$(id -un)" == "fitora-deploy" ]] || fail "SSH user is $(id -un), expected fitora-deploy"
          [[ "$(hostname)" == "aiotlab-server2" ]] || fail "hostname is $(hostname), expected aiotlab-server2"
          [[ -d "$root/fitora_backend/deploy/ubuntu" ]] || fail "$root/fitora_backend/deploy/ubuntu missing"
          [[ -d "$root/fitora_ui" ]] || fail "$root/fitora_ui missing"
          [[ -f "$root/fitora_backend/deploy/ubuntu/.env" ]] || fail "$root/fitora_backend/deploy/ubuntu/.env missing"
          docker compose version >/dev/null || fail "docker compose not available"
          cd "$root/fitora_backend"
          docker compose --env-file deploy/ubuntu/.env -f deploy/ubuntu/compose.yml config --quiet || fail "docker compose config invalid"
          services="$(docker compose --env-file deploy/ubuntu/.env -f deploy/ubuntu/compose.yml config --services)"
          for service in rabbitmq elasticsearch redis mariadb user interact notification auth mongodb chat gateway frontend; do
            grep -Fxq "$service" <<< "$services" || fail "compose service '$service' not found (services: $services)"
          done
          for volume in elasticsearch-data mariadb-data mongodb-data rabbitmq-data redis-data uploads-data; do
            docker volume inspect "fitora_${volume}" >/dev/null || fail "docker volume fitora_${volume} not found"
          done
          [[ -d "$root/incoming" ]] || fail "$root/incoming missing"
          [[ -w "$root/incoming" ]] || fail "$root/incoming not writable"
          [[ -d "$root/releases" ]] || fail "$root/releases missing"
          [[ -w "$root/releases" ]] || fail "$root/releases not writable"
          [[ -w "$root/.deploy.lock" || ( ! -e "$root/.deploy.lock" && -w "$root" ) ]] || fail "$root/.deploy.lock not writable and $root not writable"
          [[ -f deploy/ubuntu/ci-deploy.sh ]] || fail "deploy/ubuntu/ci-deploy.sh missing"
          [[ -f deploy/ubuntu/deploy.sh ]] || fail "deploy/ubuntu/deploy.sh missing"
          grep -Fxq 'CI_DEPLOY_VERSION=1' deploy/ubuntu/ci-deploy.sh || fail "CI_DEPLOY_VERSION=1 marker not found in ci-deploy.sh"
          echo "Preflight checks passed."
          REMOTE

  deploy:
    if: ${{ github.event_name == 'push' || inputs.mode == 'deploy' }}
    needs: [verify, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Connect ephemeral runner to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.FITORA_TAILSCALE_CLIENT_ID }}
          audience: ${{ secrets.FITORA_TAILSCALE_AUDIENCE }}
          tags: tag:fitora-ci
          hostname: fitora-ci-${{ github.run_id }}-${{ github.run_attempt }}
          version: 1.102.3
          timeout: 2m
          use-cache: false
          ping: ${{ vars.FITORA_DEPLOY_HOST }}
      - name: Upload source and run backend deployment
        env:
          FITORA_DEPLOY_HOST: ${{ vars.FITORA_DEPLOY_HOST }}
          FITORA_DEPLOY_PORT: ${{ vars.FITORA_DEPLOY_PORT }}
          FITORA_DEPLOY_USER: ${{ vars.FITORA_DEPLOY_USER }}
          FITORA_DEPLOY_SSH_KEY: ${{ secrets.FITORA_DEPLOY_SSH_KEY }}
          FITORA_DEPLOY_KNOWN_HOSTS: ${{ secrets.FITORA_DEPLOY_KNOWN_HOSTS }}
          FITORA_DEPLOY_ROOT: ${{ vars.FITORA_DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          [[ -n "$FITORA_DEPLOY_HOST" && -n "$FITORA_DEPLOY_USER" && -n "$FITORA_DEPLOY_SSH_KEY" && -n "$FITORA_DEPLOY_KNOWN_HOSTS" ]] || { echo "Missing Fitora deployment secrets." >&2; exit 1; }
          [[ "$FITORA_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "FITORA_DEPLOY_PORT must be numeric." >&2; exit 1; }
          [[ "$FITORA_DEPLOY_ROOT" == "/home/fitdnu/fitora" ]] || { echo "Unexpected FITORA_DEPLOY_ROOT." >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$FITORA_DEPLOY_SSH_KEY" > ~/.ssh/id_fitora
          printf '%s\n' "$FITORA_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_fitora ~/.ssh/known_hosts
          tar -czf "/tmp/backend-${GITHUB_SHA}.tar.gz" --exclude-vcs --exclude='bin' --exclude='obj' --exclude='deploy/ubuntu/.env' --exclude='deploy/ubuntu/graphify-out' .
          target="${FITORA_DEPLOY_USER}@${FITORA_DEPLOY_HOST}"
          remote_archive="${FITORA_DEPLOY_ROOT}/incoming/backend-${GITHUB_SHA}.tar.gz"
          scp -i ~/.ssh/id_fitora -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -P "$FITORA_DEPLOY_PORT" "/tmp/backend-${GITHUB_SHA}.tar.gz" "${target}:${remote_archive}"
          ssh -i ~/.ssh/id_fitora -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$FITORA_DEPLOY_PORT" "$target" "bash '${FITORA_DEPLOY_ROOT}/fitora_backend/deploy/ubuntu/ci-deploy.sh' --component backend --sha '${GITHUB_SHA}' --archive '${remote_archive}'"
