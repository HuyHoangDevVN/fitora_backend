map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    listen [::]:80;
    server_name fitora.fitdnu.id.vn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/fitora-acme; }
    # Cloudflare Tunnel terminates TLS and connects from its fixed LAN address.
    location /api/ {
        if ($remote_addr != 192.168.167.251) { return 301 https://$host$request_uri; }
        if ($http_x_forwarded_proto != https) { return 301 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location / {
        if ($remote_addr != 192.168.167.251) { return 301 https://$host$request_uri; }
        if ($http_x_forwarded_proto != https) { return 301 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fitora.fitdnu.id.vn;
    ssl_certificate /etc/letsencrypt/live/fitora.fitdnu.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitora.fitdnu.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
